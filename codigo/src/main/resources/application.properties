spring.application.name=tienda

# Base de datos H2 en memoria (arranque limpio y determinista)
spring.datasource.url=jdbc:h2:mem:tienda;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Validation errors and unhandled exceptions as RFC 9457 ProblemDetail
spring.mvc.problemdetails.enabled=true
